name: 'Build and push'
description: 'Build and push Docker image to GCP and/or Scaleway'
inputs:
  key:
    description: 'GCP service key base64 encoded; leave empty to skip pushing to GCP (deprecated: replaced with scaleway)'
    required: false
    default: ''
  scwSecretKey:
    description: 'Scaleway secret key; when set, the image is also pushed to rg.{scwRegion}.scw.cloud/nf-{serviceName}-{scwEnv}/{serviceName}:{sha}'
    required: false
    default: ''
  scwRegion:
    description: 'Scaleway region'
    required: false
    default: 'nl-ams'
  scwEnv:
    description: 'Scaleway environment whose registry receives the build, other environments copy from there on deploy'
    required: false
    default: 'dev'
  serviceName:
    description: 'name of the service'
    required: true
  region:
    description: 'GCP region'
    required: false
    default: 'europe-west4'
  dockerfile:
    description: 'Relative path to the dockerfile; default: ./Dockerfile'
    required: false
    default: './Dockerfile'
  context:
    description: 'Docker build context directory; default: .'
    required: false
    default: '.'
  tag:
    description: 'Tag for the GCP docker image; default: all'
    required: false
    default: 'all'
  sshKey:
    description: 'Pass an SSH key as a build secret (--secret). Dockerfile must use --mount=type=secret,id=sshkey.'
    required: false
    default: ''
  useSshAgent:
    description: 'Forward the host SSH agent into the build (--ssh default). Dockerfile must use --mount=type=ssh. Requires webfactory/ssh-agent or similar setup beforehand.'
    required: false
    default: 'false'
  dockerCache:
    description: 'Enable Docker layer caching via GitHub Actions cache (type=gha). Opt-in to avoid cache overhead for projects that do not benefit.'
    required: false
    default: 'false'
runs:
  using: "composite"
  steps:
    - name: Set up Cloud SDK
      # deprecated: replaced with scaleway
      if: inputs.key != ''
      uses: google-github-actions/setup-gcloud@v3
      with:
        project_id: nf-artifact-repositories

    - name: build and push docker image
      shell: bash
      env:
        GCP_KEY: ${{ inputs.key }}
        GCP_REGION: ${{ inputs.region }}
        GCP_NAME: ${{ inputs.serviceName }}
        SCW_SECRET_KEY: ${{ inputs.scwSecretKey }}
        SCW_REGION: ${{ inputs.scwRegion }}
        SCW_ENV: ${{ inputs.scwEnv }}
      # language=bash
      run: |
        set -e
        if [ -z "${GCP_KEY}" ] && [ -z "${SCW_SECRET_KEY}" ]; then
          echo "Either key (GCP) or scwSecretKey (Scaleway) is required"
          exit 1
        fi

        IMAGES=()

        # deprecated: replaced with scaleway
        if [ -n "${GCP_KEY}" ]; then
          export BASE_REPO=${GCP_REGION}-docker.pkg.dev
          export CONTAINER_REPO=${BASE_REPO}/nf-artifact-repositories/${GCP_NAME}
          echo "Authenticating with Google Cloud for project nf-artifact-repositories and docker '${BASE_REPO}'"
          echo "${GCP_KEY}" | base64 --decode > ${HOME}/gcloud-service-key.json
          gcloud auth activate-service-account --key-file=${HOME}/gcloud-service-key.json
          gcloud auth configure-docker --quiet $BASE_REPO
          IMAGES+=("${CONTAINER_REPO}/${{ inputs.tag }}:${{ github.sha }}")
        fi

        if [ -n "${SCW_SECRET_KEY}" ]; then
          export SCW_REGISTRY=rg.${SCW_REGION}.scw.cloud
          echo "Authenticating with Scaleway registry '${SCW_REGISTRY}'"
          echo "${SCW_SECRET_KEY}" | docker login "${SCW_REGISTRY}" -u nologin --password-stdin
          IMAGES+=("${SCW_REGISTRY}/nf-${GCP_NAME}-${SCW_ENV}/${GCP_NAME}:${{ github.sha }}")
        fi

        TAGS=""
        for IMG in "${IMAGES[@]}"; do
          if docker buildx imagetools inspect "${IMG}" > /dev/null 2>&1; then
            echo "Image already exists: ${IMG}"
          else
            TAGS="${TAGS} --tag \"${IMG}\""
          fi
        done

        if [ -z "${TAGS}" ]; then
          exit 0
        fi

        echo "Build and push Docker images"
        export DOCKER_BUILDKIT=1
        # needed to enable caching, without it we can't use cache-to and cache-from
        docker buildx create --name cacheable --driver docker-container --use
        DOCKER_BUILD_CMD="docker buildx build ${TAGS} --push --file \"${{ inputs.dockerfile }}\""

        if [ "${{ inputs.sshKey }}" != "" ]; then
          echo "building docker image with ssh key as secret"
          echo "${{ inputs.sshKey }}" > ${HOME}/.ssh_key
          DOCKER_BUILD_CMD="$DOCKER_BUILD_CMD --secret id=sshkey,src=$HOME/.ssh_key"
        fi

        if [ "${{ inputs.useSshAgent }}" == "true" ]; then
          echo "forwarding SSH agent into build"
          DOCKER_BUILD_CMD="$DOCKER_BUILD_CMD --ssh default"
        fi

        if [ "${{ inputs.dockerCache }}" == "true" ]; then
          DOCKER_BUILD_CMD="$DOCKER_BUILD_CMD --cache-from type=gha --cache-to type=gha,mode=max"
        fi

        DOCKER_BUILD_CMD="$DOCKER_BUILD_CMD \"${{ inputs.context }}\""

        # Execute build command
        echo "Building and pushing Docker image with command: $DOCKER_BUILD_CMD"
        eval $DOCKER_BUILD_CMD
